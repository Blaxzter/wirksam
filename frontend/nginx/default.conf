server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    index index.html index.htm;
    # The public pages are prerendered to <path>/index.html (scripts/prerender.mjs);
    # every other route gets the empty app shell, spa.html.
    try_files $uri $uri/index.html /spa.html =404;
  }

  # Installable app (PWA). Both must be revalidated on every load so a deploy
  # reaches installed apps: a cached sw.js keeps the old worker running, a
  # cached manifest the old name and icons.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
