server {
  listen 80;
  root /usr/share/nginx/html;

  # Nothing in front (Traefik) compresses, so do it here. text/html is always
  # on; the rest are the types the build and the crawler files ship.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/javascript application/json
    application/manifest+json application/xml image/svg+xml;

  # Vite puts a content hash in every file name under /assets/, so a deploy
  # never changes a file there, it only adds new ones.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    index index.html index.htm;
    # The public pages are prerendered to <path>/index.html (scripts/prerender.mjs);
    # every other route gets the empty app shell, spa.html.
    try_files $uri $uri/index.html /spa.html =404;
  }

  # Installable app (PWA). Both must be revalidated on every load so a deploy
  # reaches installed apps: a cached sw.js keeps the old worker running, a
  # cached manifest the old name and icons.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
