<!doctype html>
<!-- Placeholder only: src/locales/i18n.ts overwrites this with the resolved
     locale as soon as the app boots. It must not be empty — an empty lang is a
     WCAG failure (axe `html-has-lang`) for the pre-hydration paint. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before the first paint. The prerendered pages are on screen long
         before the app runs `useColorMode()` and `usePalette()`, so without this
         a dark-mode visitor sees them light first. Reads the same storage keys
         with the same defaults: vueuse's `vueuse-color-scheme` (auto, light or
         dark, auto following the system) and `wirksam-palette`. -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var mode = localStorage.getItem('vueuse-color-scheme') || 'auto'
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (mode === 'dark' || (mode === 'auto' && systemDark)) root.classList.add('dark')
          if (localStorage.getItem('wirksam-palette') === 'classic') {
            root.classList.add('palette-classic')
          }
        } catch (e) {
          // Storage blocked: the app picks the theme once it runs.
        }
      })()
    </script>
    <!-- `sizes="any"` is to fix Chrome bug -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WirkSam - Fabraham</title>

    <!-- SEO -->
    <meta name="description" content="The volunteer scheduling platform for church tasks and community service. Book your shifts for Pfingsten, Kirchentag, and more — effective together." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WirkSam — Volunteer Scheduling Platform" />
    <meta property="og:description" content="The volunteer scheduling platform for church tasks and community service. Book your shifts for Pfingsten, Kirchentag, and more — effective together." />
    <meta property="og:image" content="https://wirksam.fabraham.dev/screenshots/en/dashboard-light.png" />
    <meta property="og:url" content="https://wirksam.fabraham.dev" />
    <meta property="og:site_name" content="WirkSam" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WirkSam — Volunteer Scheduling Platform" />
    <meta name="twitter:description" content="The volunteer scheduling platform for church tasks and community service. Book your shifts for Pfingsten, Kirchentag, and more — effective together." />
    <meta name="twitter:image" content="https://wirksam.fabraham.dev/screenshots/en/dashboard-light.png" />
  </head>
  <body>
    <script src="/config.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
