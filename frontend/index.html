<!doctype html>
<!-- Placeholder only: src/locales/i18n.ts overwrites this with the resolved
     locale as soon as the app boots. It must not be empty — an empty lang is a
     WCAG failure (axe `html-has-lang`) for the pre-hydration paint. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before the first paint. The prerendered pages are on screen long
         before the app runs `useColorMode()` and `usePalette()`, so without this
         a dark-mode visitor sees them light first. Reads the same storage keys
         with the same defaults: vueuse's `vueuse-color-scheme` (auto, light or
         dark, auto following the system) and `wirksam-palette`. -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var mode = localStorage.getItem('vueuse-color-scheme') || 'auto'
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (mode === 'dark' || (mode === 'auto' && systemDark)) root.classList.add('dark')
          if (localStorage.getItem('wirksam-palette') === 'classic') {
            root.classList.add('palette-classic')
          }
        } catch (e) {
          // Storage blocked: the app picks the theme once it runs.
        }
      })()
    </script>
    <!-- Icons are rendered from public/icon.svg with LogoLab's `pwa` preset:
         transparent for the favicons and public/icons/icon-*.png, on the
         --background colour (#f3ece0) for apple-touch-icon.png (12% padding;
         iOS needs it opaque) and public/icons/maskable-*.png. -->
    <!-- `sizes="any"` is to fix Chrome bug -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Installed app: title-bar / status-bar colour, matching --background in
         src/index.css for each scheme. The manifest's theme_color is the
         light one, for browsers that ignore the media queries. -->
    <meta name="theme-color" content="#f3ece0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c110d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WirkSam" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WirkSam - Fabraham</title>

    <!-- SEO -->
    <meta name="description" content="Free volunteer shift planning for clubs, festivals, congregations and any event run by volunteers. Plan the roster together and get a reminder before every shift." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WirkSam — Volunteer Scheduling Platform" />
    <meta property="og:description" content="Free volunteer shift planning for clubs, festivals, congregations and any event run by volunteers. Plan the roster together and get a reminder before every shift." />
    <!-- Rendered by scripts/generate-og-images.mjs; the prerender swaps in the
         German card on the German pages. -->
    <meta property="og:image" content="https://wirksam.app/og/wirksam-en.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WirkSam: Plan the roster for your next event together." />
    <meta property="og:url" content="https://wirksam.app" />
    <meta property="og:site_name" content="WirkSam" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WirkSam — Volunteer Scheduling Platform" />
    <meta name="twitter:description" content="Free volunteer shift planning for clubs, festivals, congregations and any event run by volunteers. Plan the roster together and get a reminder before every shift." />
    <meta name="twitter:image" content="https://wirksam.app/og/wirksam-en.png" />
    <meta name="twitter:image:alt" content="WirkSam: Plan the roster for your next event together." />
  </head>
  <body>
    <script src="/config.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
