name: Playwright Tests

on:
    push:
        branches:
            - main
        paths:
            - "backend/**"
            - "frontend/**"
            - ".env"
            - "docker-compose*.yml"
            - ".github/workflows/playwright.yml"
    pull_request:
        types:
            - opened
            - synchronize
        branches:
            - main
            - dev
        paths:
            - "backend/**"
            - "frontend/**"
            - ".env"
            - "docker-compose*.yml"
            - ".github/workflows/playwright.yml"
    workflow_dispatch:
        inputs:
            debug_enabled:
                description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
                required: false
                default: "false"

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        # Set job outputs to values from filter step
        outputs:
            changed: ${{ steps.filter.outputs.changed }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # For pull requests it's not necessary to checkout the code but for the main branch it is
            - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
              id: filter
              with:
                  # On a push, compare against the commit this push replaced.
                  #
                  # Left unset, paths-filter compares against the repository's
                  # DEFAULT branch — which here is `dev`, not `main`. Merges to
                  # main are fast-forwards from dev, so the two refs are equal
                  # and that diff is always empty: `changed` came back false,
                  # the matrix below was skipped, and `allowed-skips` let
                  # alls-green-playwright report success over a suite that never
                  # ran. Every main push since the pattern was added reported a
                  # 15-second green.
                  #
                  # On pull_request the default is already right (the PR base),
                  # so this only overrides the push case.
                  base: ${{ github.event_name == 'push' && github.event.before || '' }}
                  filters: |
                      changed:
                        - backend/**
                        - frontend/**
                        - .env
                        - docker-compose*.yml
                        - .github/workflows/playwright.yml

    test-playwright:
        needs:
            - changes
        # workflow_dispatch has no diff to compute a base from, and a human who
        # clicked "Run workflow" wants the suite run — not path-filtered away.
        if: ${{ needs.changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 60
        runs-on: ubuntu-latest
        strategy:
            matrix:
                shardIndex: [1, 2, 3, 4]
                shardTotal: [4]
            fail-fast: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Must precede setup-node: `cache: pnpm` shells out to `pnpm store path`,
            # so pnpm has to be on PATH already.
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: frontend/package.json
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.13"
            - name: Setup tmate session
              uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
              with:
                  limit-access-to-actor: true
            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
              with:
                  version: "0.4.15"
                  enable-cache: true
            - run: uv sync
              working-directory: backend
            - run: pnpm install --frozen-lockfile
              working-directory: frontend
            # Uploaded files go to the Garage container, as .env.example sets
            # up, so E2E covers the S3 backend; the backend suite covers
            # Postgres. Images come as signed links, which the browser in the
            # Playwright container follows to the garage service by name.
            - name: Create .env file
              run: |
                  cp .env.example .env
                  sed -i 's|^S3_PUBLIC_ENDPOINT_URL=.*|S3_PUBLIC_ENDPOINT_URL=http://garage:3900|' .env
            - run: uv run bash scripts/generate-client.sh
              env:
                  VIRTUAL_ENV: backend/.venv
            - name: Create external network
              run: docker network create traefik-net || true
            - run: docker compose --profile s3 -f docker-compose.yml -f docker-compose.override.yml build
            - run: docker compose --profile s3 -f docker-compose.yml -f docker-compose.override.yml down -v --remove-orphans
            - name: Start backend and wait for healthy
              run: docker compose --profile s3 -f docker-compose.yml -f docker-compose.override.yml up -d --wait garage backend mailcatcher
            - name: Run Playwright tests
              run: docker compose --profile s3 -f docker-compose.yml -f docker-compose.override.yml run --rm playwright npx playwright test --fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
            - run: docker compose --profile s3 -f docker-compose.yml -f docker-compose.override.yml down -v --remove-orphans
            - name: Upload blob report to GitHub Actions Artifacts
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: blob-report-${{ matrix.shardIndex }}
                  path: frontend/blob-report
                  include-hidden-files: true
                  retention-days: 1

    merge-playwright-reports:
        needs:
            - test-playwright
            - changes
        # Merge reports after playwright-tests, even if some shards have failed
        if: ${{ !cancelled() && needs.changes.outputs.changed == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Must precede setup-node: `cache: pnpm` shells out to `pnpm store path`,
            # so pnpm has to be on PATH already.
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: frontend/package.json
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: frontend
            - name: Download blob reports from GitHub Actions Artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: frontend/all-blob-reports
                  pattern: blob-report-*
                  merge-multiple: true
            - name: Merge into HTML Report
              run: npx playwright merge-reports --reporter html ./all-blob-reports
              working-directory: frontend
            - name: Upload HTML report
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: html-report--attempt-${{ github.run_attempt }}
                  path: frontend/playwright-report
                  retention-days: 30
                  include-hidden-files: true

    # https://github.com/marketplace/actions/alls-green#why
    alls-green-playwright: # This job does nothing and is only used for the branch protection
        if: always()
        needs:
            - test-playwright
        runs-on: ubuntu-latest
        steps:
            - name: Decide whether the needed jobs succeeded or failed
              uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
              with:
                  jobs: ${{ toJSON(needs) }}
                  allowed-skips: test-playwright
