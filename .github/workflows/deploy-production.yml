name: Deploy to Production

on:
    release:
        types:
            - published

env:
    REGISTRY: ghcr.io

permissions:
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set image names
              id: images
              run: |
                  REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  echo "backend=ghcr.io/${REPO_LOWER}/backend" >> "$GITHUB_OUTPUT"
                  echo "frontend=ghcr.io/${REPO_LOWER}/frontend" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract version tag
              id: meta
              run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

            - name: Build and push backend image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: ./backend
                  push: true
                  tags: |
                      ${{ steps.images.outputs.backend }}:${{ steps.meta.outputs.tag }}
                      ${{ steps.images.outputs.backend }}:latest
                  cache-from: type=registry,ref=${{ steps.images.outputs.backend }}:buildcache
                  cache-to: type=registry,ref=${{ steps.images.outputs.backend }}:buildcache,mode=max

            - name: Build and push frontend image
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: ./frontend
                  push: true
                  tags: |
                      ${{ steps.images.outputs.frontend }}:${{ steps.meta.outputs.tag }}
                      ${{ steps.images.outputs.frontend }}:latest
                  build-args: |
                      VITE_API_URL=https://${{ secrets.API_DOMAIN }}/api/v1
                      NODE_ENV=production
                      APP_VERSION=${{ steps.meta.outputs.tag }}
                  cache-from: type=registry,ref=${{ steps.images.outputs.frontend }}:buildcache
                  cache-to: type=registry,ref=${{ steps.images.outputs.frontend }}:buildcache,mode=max

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        permissions: {}

        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  envs: GHCR_PAT,GHCR_USER,DEPLOY_PATH
                  script: |
                      set -e

                      cd "$DEPLOY_PATH"

                      # Mark deploy path as safe (owner may differ from SSH user)
                      git config --global --add safe.directory "$DEPLOY_PATH"

                      # Pull latest compose and config files (use HTTPS to avoid SSH host key issues)
                      git remote set-url origin "https://github.com/${{ github.repository }}.git"
                      git pull --ff-only

                      # Log in to GHCR
                      echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

                      # Pull new images and restart (exclude override to avoid dev settings)
                      docker compose -f docker-compose.yml pull backend frontend prestart
                      docker compose -f docker-compose.yml up -d --remove-orphans

                      # Wait for health checks
                      echo "Waiting for backend to become healthy..."
                      timeout 120 bash -c 'until docker compose -f docker-compose.yml ps backend | grep -q "healthy"; do sleep 5; done'
                      echo "Waiting for frontend to become healthy..."
                      timeout 60 bash -c 'until docker compose -f docker-compose.yml ps frontend | grep -q "healthy"; do sleep 5; done'
                      echo "Deployment complete!"
              env:
                  GHCR_PAT: ${{ secrets.GHCR_PAT }}
                  GHCR_USER: ${{ github.actor }}
                  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    sync-dev:
        # Releases are cut from main, but dev is the default branch, so
        # Dependabot and new feature branches start from it. Bring it level with
        # what just shipped, or it drifts releases behind. Runs only after a
        # successful deploy; a merge conflict fails this job, not the deploy.
        needs: deploy
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout dev
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: dev
                  fetch-depth: 0

            - name: Merge the released commit into dev
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git merge --no-edit "$GITHUB_SHA"
                  git push origin dev
