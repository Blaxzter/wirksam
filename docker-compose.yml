services:
    db:
        image: postgres:16.9
        restart: always
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s
        volumes:
            - app-db-data:/var/lib/postgresql/data/pgdata
        env_file:
            - .env
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdata
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
            - POSTGRES_USER=${POSTGRES_USER?Variable not set}
            - POSTGRES_DB=${POSTGRES_DB?Variable not set}

    adminer:
        image: adminer
        restart: always
        networks:
            - traefik-net
            - default
        depends_on:
            - db
        environment:
            - ADMINER_DESIGN=pepa-linha-dark
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-net
            - traefik.constraint-label=traefik-net
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=web
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=websecure
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=letsencrypt
            - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

    prestart:
        image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
        build:
            context: ./backend
        networks:
            - traefik-net
            - default
        depends_on:
            db:
                condition: service_healthy
                restart: true
        command: bash scripts/prestart.sh
        env_file:
            - .env
        environment:
            - DOMAIN=${DOMAIN}
            - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
            - ENVIRONMENT=${ENVIRONMENT}
            - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
            - SMTP_HOST=${SMTP_HOST}
            - SMTP_USER=${SMTP_USER}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
            - POSTGRES_SERVER=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER?Variable not set}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
            - SENTRY_DSN=${SENTRY_DSN}

    backend:
        image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
        restart: always
        networks:
            - traefik-net
            - default
        depends_on:
            db:
                condition: service_healthy
                restart: true
            prestart:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - DOMAIN=${DOMAIN}
            - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
            - ENVIRONMENT=${ENVIRONMENT}
            - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
            - SMTP_HOST=${SMTP_HOST}
            - SMTP_USER=${SMTP_USER}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
            # The demo-session knobs. SANDBOX_ENABLED is also handed to the
            # frontend service below, which serves it to the browser — the two
            # have to agree or the landing page offers a button the API refuses.
            - SANDBOX_ENABLED=${SANDBOX_ENABLED:-true}
            - SANDBOX_TTL_MINUTES=${SANDBOX_TTL_MINUTES:-60}
            - SANDBOX_MAX_ACTIVE=${SANDBOX_MAX_ACTIVE:-25}
            - POSTGRES_SERVER=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER?Variable not set}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
            - SENTRY_DSN=${SENTRY_DSN}

        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8787/api/v1/healthz"]
            interval: 10s
            timeout: 5s
            retries: 5
            # Without a start period the first probe only fires at `interval`,
            # and `docker compose up --wait` can give up while the container is
            # still `starting` — a flaky failure with a perfectly healthy app.
            # `start_interval` probes every 2s during boot so it flips to
            # healthy as soon as it actually is.
            start_period: 30s
            start_interval: 2s

        build:
            context: ./backend
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-net
            - traefik.constraint-label=traefik-net

            - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8787

            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`${API_DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=web

            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`${API_DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=websecure
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=letsencrypt

    frontend:
        image: "${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}"
        restart: always
        environment:
            - LEGAL_NAME=${LEGAL_NAME:-}
            - LEGAL_ADDRESS=${LEGAL_ADDRESS:-}
            - LEGAL_CITY=${LEGAL_CITY:-}
            - LEGAL_EMAIL=${LEGAL_EMAIL:-}
            - LEGAL_PHONE=${LEGAL_PHONE:-}
            - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
            # Reaches the browser through docker-entrypoint.sh; must match the
            # backend's copy above, which is what actually enforces it.
            - SANDBOX_ENABLED=${SANDBOX_ENABLED:-true}
            # Absolute URLs in the prerendered pages, sitemap.xml and llms.txt
            # are rewritten to this host by docker-entrypoint.sh.
            - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
            # 'false' tells every crawler to stay away (robots.txt: Disallow: /).
            - SEARCH_INDEXING=${SEARCH_INDEXING:-true}
            # 'false' drops the landing page: / leads to sign-in or the dashboard.
            - LANDING_ENABLED=${LANDING_ENABLED:-true}
        networks:
            - traefik-net
            - default
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 10s
            timeout: 5s
            retries: 5
        build:
            context: ./frontend
            args:
                - VITE_API_URL=https://${API_DOMAIN?Variable not set}/api/v1
                - NODE_ENV=production
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-net
            - traefik.constraint-label=traefik-net

            - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=web

            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=websecure
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=letsencrypt

volumes:
    app-db-data:

networks:
    traefik-net:
        # Allow setting it to false for testing
        external: true
