services:
    db:
        image: postgres:16.9
        restart: always
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 10s
            retries: 5
            start_period: 30s
            timeout: 10s
        volumes:
            - app-db-data:/var/lib/postgresql/data/pgdata
        env_file:
            - .env
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdata
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
            - POSTGRES_USER=${POSTGRES_USER?Variable not set}
            - POSTGRES_DB=${POSTGRES_DB?Variable not set}

    adminer:
        image: adminer
        restart: always
        networks:
            - traefik-net
            - default
        depends_on:
            - db
        environment:
            - ADMINER_DESIGN=pepa-linha-dark
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-net
            - traefik.constraint-label=traefik-net
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.rule=Host(`adminer.${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-http.entrypoints=web
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.rule=Host(`adminer.${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.entrypoints=websecure
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls=true
            - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=letsencrypt
            - traefik.http.services.${STACK_NAME?Variable not set}-adminer.loadbalancer.server.port=8080

    # S3-compatible object storage for uploaded files, for STORAGE_BACKEND=s3
    # without a cloud bucket (docs/STORAGE.md). Off unless the profile is
    # asked for: `docker compose --profile s3 up -d`. On first start Garage
    # lays out its single node and creates S3_BUCKET with the key pair from
    # .env, so nothing has to be set up by hand. Browsers fetch images from it
    # through signed links at files.${DOMAIN}; set S3_PUBLIC_ENDPOINT_URL to
    # https://files.${DOMAIN} to match.
    garage:
        image: dxflrs/garage:v2.4.1
        profiles: ["s3"]
        restart: always
        networks:
            - traefik-net
            - default
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-net
            - traefik.constraint-label=traefik-net
            # Traefik passes the Host header through, which the signature covers.
            - traefik.http.services.${STACK_NAME?Variable not set}-files.loadbalancer.server.port=3900
            - traefik.http.routers.${STACK_NAME?Variable not set}-files-http.rule=Host(`files.${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-files-http.entrypoints=web
            - traefik.http.routers.${STACK_NAME?Variable not set}-files-https.rule=Host(`files.${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-files-https.entrypoints=websecure
            - traefik.http.routers.${STACK_NAME?Variable not set}-files-https.tls=true
            - traefik.http.routers.${STACK_NAME?Variable not set}-files-https.tls.certresolver=letsencrypt
        command: ["/garage", "server", "--single-node", "--default-bucket"]
        configs:
            - source: garage_toml
              target: /etc/garage.toml
        volumes:
            - garage-meta:/var/lib/garage/meta
            - garage-data:/var/lib/garage/data
        healthcheck:
            # The image has no shell; the garage binary asks the node itself.
            test: ["CMD", "/garage", "status"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
            start_interval: 1s
        # Not "?Variable not set": Compose checks that for every service, even
        # one whose profile is off, so a Postgres install without these would
        # not start at all. Garage itself refuses to start without them.
        environment:
            - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-}
            - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY_ID:-}
            - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_ACCESS_KEY:-}
            - GARAGE_DEFAULT_BUCKET=${S3_BUCKET:-}

    prestart:
        image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
        build:
            context: ./backend
        networks:
            - traefik-net
            - default
        depends_on:
            db:
                condition: service_healthy
                restart: true
            # Only with the s3 profile: prestart sets the bucket's CORS rule.
            garage:
                condition: service_healthy
                required: false
        command: bash scripts/prestart.sh
        env_file:
            - .env
        environment:
            - DOMAIN=${DOMAIN}
            - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
            - ENVIRONMENT=${ENVIRONMENT}
            - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
            - SMTP_HOST=${SMTP_HOST}
            - SMTP_USER=${SMTP_USER}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
            - POSTGRES_SERVER=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER?Variable not set}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
            - SENTRY_DSN=${SENTRY_DSN}

    backend:
        image: "${DOCKER_IMAGE_BACKEND?Variable not set}:${TAG-latest}"
        restart: always
        networks:
            - traefik-net
            - default
        depends_on:
            db:
                condition: service_healthy
                restart: true
            prestart:
                condition: service_completed_successfully
        env_file:
            - .env
        environment:
            - DOMAIN=${DOMAIN}
            - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
            - ENVIRONMENT=${ENVIRONMENT}
            - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
            - SMTP_HOST=${SMTP_HOST}
            - SMTP_USER=${SMTP_USER}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - EMAILS_FROM_EMAIL=${EMAILS_FROM_EMAIL}
            - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
            # The demo-session knobs. SANDBOX_ENABLED is also handed to the
            # frontend service below, which serves it to the browser — the two
            # have to agree or the landing page offers a button the API refuses.
            - SANDBOX_ENABLED=${SANDBOX_ENABLED:-true}
            - SANDBOX_TTL_MINUTES=${SANDBOX_TTL_MINUTES:-60}
            - SANDBOX_MAX_ACTIVE=${SANDBOX_MAX_ACTIVE:-25}
            # Uploaded files: "postgres" (default) or "s3" (docs/STORAGE.md).
            # With the garage service above, S3_ENDPOINT_URL is http://garage:3900.
            - STORAGE_BACKEND=${STORAGE_BACKEND:-postgres}
            - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
            - S3_REGION=${S3_REGION:-auto}
            - S3_BUCKET=${S3_BUCKET:-}
            - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
            - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
            - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-}
            - POSTGRES_SERVER=db
            - POSTGRES_PORT=5432
            - POSTGRES_DB=${POSTGRES_DB}
            - POSTGRES_USER=${POSTGRES_USER?Variable not set}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
            - SENTRY_DSN=${SENTRY_DSN}

        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8787/api/v1/healthz"]
            interval: 10s
            timeout: 5s
            retries: 5
            # Without a start period the first probe only fires at `interval`,
            # and `docker compose up --wait` can give up while the container is
            # still `starting` — a flaky failure with a perfectly healthy app.
            # `start_interval` probes every 2s during boot so it flips to
            # healthy as soon as it actually is.
            start_period: 30s
            start_interval: 2s

        build:
            context: ./backend
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-net
            - traefik.constraint-label=traefik-net

            - traefik.http.services.${STACK_NAME?Variable not set}-backend.loadbalancer.server.port=8787

            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.rule=Host(`${API_DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-http.entrypoints=web

            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.rule=Host(`${API_DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.entrypoints=websecure
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls=true
            - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=letsencrypt

    frontend:
        image: "${DOCKER_IMAGE_FRONTEND?Variable not set}:${TAG-latest}"
        restart: always
        environment:
            - LEGAL_NAME=${LEGAL_NAME:-}
            - LEGAL_ADDRESS=${LEGAL_ADDRESS:-}
            - LEGAL_CITY=${LEGAL_CITY:-}
            - LEGAL_EMAIL=${LEGAL_EMAIL:-}
            - LEGAL_PHONE=${LEGAL_PHONE:-}
            - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
            # Reaches the browser through docker-entrypoint.sh; must match the
            # backend's copy above, which is what actually enforces it.
            - SANDBOX_ENABLED=${SANDBOX_ENABLED:-true}
            # Absolute URLs in the prerendered pages, sitemap.xml and llms.txt
            # are rewritten to this host by docker-entrypoint.sh.
            - FRONTEND_HOST=${FRONTEND_HOST?Variable not set}
            # 'false' tells every crawler to stay away (robots.txt: Disallow: /).
            - SEARCH_INDEXING=${SEARCH_INDEXING:-true}
            # 'false' drops the landing page: / leads to sign-in or the dashboard.
            - LANDING_ENABLED=${LANDING_ENABLED:-true}
        networks:
            - traefik-net
            - default
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 10s
            timeout: 5s
            retries: 5
        build:
            context: ./frontend
            args:
                - VITE_API_URL=https://${API_DOMAIN?Variable not set}/api/v1
                - NODE_ENV=production
        labels:
            - traefik.enable=true
            - traefik.docker.network=traefik-net
            - traefik.constraint-label=traefik-net

            - traefik.http.services.${STACK_NAME?Variable not set}-frontend.loadbalancer.server.port=80

            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.rule=Host(`${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-http.entrypoints=web

            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.rule=Host(`${DOMAIN?Variable not set}`)
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.entrypoints=websecure
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls=true
            - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=letsencrypt

volumes:
    app-db-data:
    garage-meta:
    garage-data:

configs:
    garage_toml:
        content: |
            metadata_dir = "/var/lib/garage/meta"
            data_dir = "/var/lib/garage/data"
            db_engine = "sqlite"
            replication_factor = 1
            rpc_bind_addr = "[::]:3901"
            rpc_public_addr = "127.0.0.1:3901"

            [s3_api]
            s3_region = "garage"
            api_bind_addr = "[::]:3900"

networks:
    traefik-net:
        # Allow setting it to false for testing
        external: true
