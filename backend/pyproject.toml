[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<4.0"
dependencies = [
    # Not fastapi[standard]: since 0.142 that extra also installs the
    # OpenTelemetry SDK and exporter, httpx2 and fastapi-cloud-cli, none of
    # which the app uses. fastapi-cli provides `fastapi run` (the Dockerfile CMD)
    # and brings uvicorn[standard]; the other extras are declared below.
    "fastapi>=0.162.0,<1.0.0",
    "fastapi-cli>=0.0.32,<1.0.0",

    # Updated dependencies with latest compatible versions
    "python-multipart>=0.0.32,<1.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "tenacity>=9.2.1,<10.0.0",

    "pydantic>=2.14.1,<3.0.0",
    "fastapi-mail>=1.6.8,<2.0",
    # Imported directly by app/logic/auth/emails.py and the notification email
    # channel, which drive SMTP themselves rather than going through
    # fastapi-mail. It arrives transitively via fastapi-mail today, but a
    # transitive pin is not a promise: declare what we import.
    "aiosmtplib>=5.1.3,<6.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "alembic>=1.20.1,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.48,<1.0.0",
    "asyncpg>=0.32.0,<1.0.0",
    # SQLAlchemy's own greenlet marker leaves out macOS arm64, where the async
    # engine then fails on its first query. Required everywhere, so say so.
    "greenlet>=3.5.6",

    "bcrypt>=5.0.0",

    "pydantic-settings>=2.16.1,<3.0.0",
    "sentry-sdk[fastapi]>=2.73.0,<3.0.0",
    "pyjwt>=2.15.1,<3.0.0",

    # Force newer httptools version for Python 3.13 compatibility
    "httptools>=0.9.0,<1.0.0",
    "pywebpush>=2.5.0,<3.0.0",
    "icalendar>=7.3.0,<8.0.0",
    "pillow>=13.0.0,<14.0.0",

    # Uploaded files in S3-compatible object storage (R2, Garage, MinIO) when
    # STORAGE_BACKEND=s3; see app/core/storage.py. Called from a thread pool.
    "boto3>=1.40.0,<2.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.1,<2.0.0",
    "basedpyright>=1.40.2,<2.0.0",
    "ruff>=0.17.2,<1.0.0",
    "pre-commit>=4.7.0,<5.0.0",
    "coverage>=7.17.0,<8.0.0",
    "pytest-testmon>=2.2.0",
    # Gates coverage of *changed* lines against the merge base in CI. An
    # aggregate floor alone lets a large PR add hundreds of uncovered lines and
    # still pass, which is how a codebase drifts down without any single PR
    # looking bad.
    "diff-cover>=10.6.0",
    # The S3 storage backend under test, in process (STORAGE_BACKEND=s3).
    "moto[s3]>=5.1.0,<6.0.0",
    "boto3-stubs[s3]>=1.40.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = ["**/alembic"]
reportMissingTypeStubs = "warning"

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
# Required: without greenlet tracking, coverage cannot follow execution across
# SQLAlchemy's greenlet boundary and async route bodies read as uncovered
# (understates the total by ~13 points). Set here rather than on a single
# command line so every entry point — `just test-backend`, `scripts/test.sh`,
# and CI — reports the same number. "thread" because the S3 storage backend
# runs boto3 in worker threads (app/core/storage.py).
concurrency = ["greenlet", "thread"]
# Every entry below is a deliberate, justified exclusion (see #127). Nothing is
# omitted merely because it is inconvenient to test — if a module contains
# branching business logic it belongs in the measured denominator, even at a
# low percentage, so the gap is visible rather than hidden.
omit = [
    # ASGI app assembly, middleware wiring and the lifespan hook. Has no branch
    # logic of its own and is exercised end-to-end by the Playwright and
    # test-docker-compose CI jobs on every PR.
    "app/main.py",
    # Dev-only diagnostics router; not mounted outside local development.
    "app/api/routes/debug.py",
    # Exists only when TESTING=true, to support the E2E suite's Auth0 bypass.
    # Testing the test harness with the test harness is circular; the E2E suite
    # fails loudly if these break.
    "app/api/routes/testing.py",
    # Thin "retry until the database answers, then exit" CLI wrappers. No
    # branching of their own, and both run on every CI job via
    # scripts/prestart.sh and scripts/tests-start.sh — a unit test would assert
    # less than CI already does.
    "app/scripts/backend_pre_start.py",
    "app/scripts/tests_pre_start.py",
    "app/scripts/initial_data.py",
]
# NOTE: `app/scripts/check_upcoming_shifts.py` is deliberately NOT omitted. It is
# also a cron entry point, but unlike the three above it contains real selection
# logic (lookahead window, full-shift skip, re-notification dedupe), so it is
# measured and tested.

[tool.coverage.report]
# The aggregate floor. Measured total when this landed was 96.03%
# (5297 statements, 210 missed) against the honest post-#127 denominator — no
# curated `omit` list propping it up.
#
# Set to 95 rather than a literal round-down of 96, deliberately. #135's own
# complaint about the old smokeshow gate was that "the project sits at exactly
# the threshold — one uncovered branch away from flipping"; setting 96 against
# 96.03 would recreate exactly that. One point of slack keeps an honest
# refactor from red-lining `dev`, and the real anti-erosion mechanism is the
# diff-cover gate on *changed* lines in test-backend.yml, which is stricter.
#
# Ratchet this up as coverage rises. It should never go down.
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Deprecations become errors here, before an upgrade turns them into breakage.
filterwarnings = ["error::sqlalchemy.exc.SADeprecationWarning"]
