# Docker Compose for E2E testing.
# Used by scripts/run-e2e-docker.mjs — not meant to be run directly.
#
# Reads Auth0 + other secrets from .env, then overrides DB/SMTP/networking
# so services talk to each other inside Docker while Playwright connects
# from the host via exposed ports.

services:
  db:
    image: postgres:16.9
    restart: "no"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app}
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_DB=${POSTGRES_DB:-app}
    # RAM-backed storage — faster, no leftover volumes
    tmpfs:
      - /var/lib/postgresql/data

  prestart:
    build:
      context: ./backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    env_file: .env
    environment:
      - TESTING=true
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - SMTP_HOST=mailcatcher
      - SMTP_PORT=1025
      - SMTP_TLS=False
      - SMTP_SSL=False
      - SMTP_USER=
      - SMTP_PASSWORD=

  backend:
    build:
      context: ./backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      - TESTING=true
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - BACKEND_CORS_ORIGINS=http://localhost,http://localhost:5555,http://localhost:4173
      - SMTP_HOST=mailcatcher
      - SMTP_PORT=1025
      - SMTP_TLS=False
      - SMTP_SSL=False
      # Blanked like the Turnstile secret below: a real mail account in .env
      # would otherwise log in to mailcatcher, which offers no AUTH, so every
      # mail failed with "Failed to send" in the backend log.
      - SMTP_USER=
      - SMTP_PASSWORD=
      - FRONTEND_HOST=http://localhost:5555
      # Blanked on purpose. `env_file: .env` above pulls in whatever the
      # developer running this has configured, and a real Turnstile secret
      # there would make the registration spec fail on a challenge the
      # Playwright browser never solved — the frontend built here ships an
      # empty site key, so no widget renders and no token exists to send.
      # Enforcement hangs off this secret alone (app/core/turnstile.py), so
      # emptying it is what restores the pre-Turnstile behaviour.
      - TURNSTILE_SECRET_KEY=
      # Demo sessions stay on: the suite exercises the landing-page button.
      # SANDBOX_MAX_ACTIVE is the one that has to be raised — the production
      # default of 25 is a ceiling on *live* demos, and a locally parallel run
      # (`workers: undefined` outside CI, so one per core) leaves a trail of
      # them behind until the TTL sweep catches up. A number that cannot be
      # reached is what keeps a spec from failing on a 503 somebody else caused.
      - SANDBOX_ENABLED=true
      - SANDBOX_TTL_MINUTES=60
      - SANDBOX_MAX_ACTIVE=500
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/v1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: "no"
    ports:
      - "5555:5555"
    environment:
      - VITE_API_URL=http://localhost:8787/api/v1
      - VITE_E2E_AUTH_BYPASS=true

  mailcatcher:
    image: schickling/mailcatcher
    restart: "no"
    # Only the inbox is published. The backend reaches SMTP (1025) over the
    # compose network, and publishing it would make the stack fail to start
    # whenever another project's mail container already holds host port 1025.
    ports:
      - "1080:1080"
